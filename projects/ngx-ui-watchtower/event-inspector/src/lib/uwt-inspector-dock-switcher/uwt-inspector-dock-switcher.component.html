<span class="uwt-inspector-dock__label" aria-hidden="true">Dock</span>
<div
  class="uwt-inspector-dock__group"
  role="group"
  aria-label="Dock the Event Inspector">
  @for (option of options; track option.dock) {
    <button
      type="button"
      class="uwt-inspector-dock__option"
      [attr.aria-pressed]="option.dock === dock()"
      [attr.aria-label]="option.label"
      [attr.data-dock]="option.dock"
      [cpsTooltip]="option.label"
      tooltipPosition="bottom"
      (click)="choose(option.dock)">
      @switch (option.dock) {
        @case ('dialog') {
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" />
            <rect x="5" y="6" width="7" height="5" rx="0.5" class="filled" />
          </svg>
        }
        @case ('window') {
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M9.5 2.5h4v4M13.5 2.5 8 8" />
            <path
              d="M12 9.5V12a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 2 12V5a1.5 1.5 0 0 1 1.5-1.5H6" />
          </svg>
        }
        @case ('left') {
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" />
            <rect x="2" y="3" width="4.5" height="10" class="filled" />
          </svg>
        }
        @case ('bottom') {
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" />
            <rect x="2" y="8.5" width="12" height="4.5" class="filled" />
          </svg>
        }
        @case ('right') {
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" />
            <rect x="9.5" y="3" width="4.5" height="10" class="filled" />
          </svg>
        }
      }
    </button>
  }
</div>
