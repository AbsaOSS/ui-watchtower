name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      core_release_created: ${{ steps.release.outputs['projects/ui-watchtower--release_created'] }}
      ngx_release_created: ${{ steps.release.outputs['projects/ngx-ui-watchtower--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: >-
      ${{ needs.release-please.outputs.core_release_created == 'true' ||
      needs.release-please.outputs.ngx_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # Required for npm trusted publishing (OIDC). No npm token needed.
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache in a job that can publish: a poisoned cache
          # could reach the OIDC token.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build both packages
        run: npm run build

      # The core first: the Angular package depends on it, and a failed step
      # stops the job. Each skips a version npm already has, so "Re-run failed
      # jobs" finishes a partial release.
      - name: Publish the core
        if: needs.release-please.outputs.core_release_created == 'true'
        working-directory: dist/ui-watchtower
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "$name@$version" version)" = "$version" ]; then
            echo "$name@$version is already on npm"
          else
            npm publish
          fi

      - name: Publish the Angular package
        if: needs.release-please.outputs.ngx_release_created == 'true'
        working-directory: dist/ngx-ui-watchtower
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "$name@$version" version)" = "$version" ]; then
            echo "$name@$version is already on npm"
          else
            npm publish
          fi
