name: Release Please

on:
  push:
    branches:
      - main
  # Retries a failed or partial publish: run it on the release tag,
  # e.g. `gh workflow run release-please.yml --ref ngx-ui-watchtower-v0.5.0`.
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      core_release_created: ${{ steps.release.outputs['projects/ui-watchtower--release_created'] }}
      ngx_release_created: ${{ steps.release.outputs['projects/ngx-ui-watchtower--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    # After a release of either package, or when run by hand to retry. On a
    # manual run release-please is skipped, which !cancelled() lets through.
    if: >-
      ${{ !cancelled() && (
      github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.core_release_created == 'true' ||
      needs.release-please.outputs.ngx_release_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      # Required for npm trusted publishing (OIDC). No npm token needed.
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache in a job that can publish: a poisoned cache
          # could reach the OIDC token.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build both packages
        run: npm run build

      # The core, then the Angular package: each only if its release tag
      # points at this commit and the version isn't on npm yet.
      - name: Publish to npm
        run: node scripts/publish-packages.mjs
